services:
  gitlab:
    image: gitlab/gitlab-ee:latest
    container_name: gitlab
    restart: always
    hostname: 'gitlab.example.com'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.local.com:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424
        registry_external_url 'http://gitlab.registry.local.com:5050'
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 2
        prometheus_monitoring['enable'] = false
        postgresql['shared_buffers'] = "256MB"
        gitaly['configuration'] = { concurrency: [{ 'rpc' => "/gitaly.SmartHTTPService/PostReceivePack", 'max_per_repo' => 2 }] }
    ports:
      - '8929:8929'
      - '443:443'
      - '2424:22'
      - '5050:5050'
    volumes:
      - './config:/etc/gitlab'
      - './logs:/var/log/gitlab'
      - './data:/var/opt/gitlab'
    shm_size: '256m'